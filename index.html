<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubjet 的碎碎念</title>
    <style>
        :root { --bg: #ffffff; --text: #222; --date: #999; --border: #f0f0f0; }
        body { max-width: 500px; margin: 0 auto; padding: 40px 20px; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); }
        h1 { font-size: 24px; font-weight: 800; letter-spacing: -1px; margin-bottom: 50px; }
        .post { margin-bottom: 40px; position: relative; }
        .date { font-size: 12px; color: var(--date); margin-bottom: 8px; font-family: monospace; }
        .content { font-size: 16px; line-height: 1.6; word-wrap: break-word; }
        
/* 纯净图片样式 */
        .content img { 
            max-width: 100%; 
            height: auto; 
            display: block; 
            margin: 15px 0; 
            border-radius: 4px; /* 轻微圆角，增加精致感 */
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); /* 极轻微阴影，增加层次 */
        }
        .content img:hover { filter: grayscale(0%); }

        hr { border: 0; border-top: 1px solid var(--border); margin-top: 40px; }
        @media (max-width: 600px) { body { padding: 30px 15px; } }
    </style>
</head>
<body>
    <h1>碎碎念.</h1>

    <div id="feed">
        <div class="post">
            <div class="date">2026-04-18 12:00</div>
            <div class="content">
                透过 R2 存储分发的碎片。在这个维度里，图像也是一种加密的语言。
            </div>
        </div>

        <div class="post">
            <div class="date">2026-04-15 19:54</div>
            <div class="content">现在正式开始更新。</div>
        </div>

        <div class="post">
            <div class="date">2026-04-15 19:30</div>
            <div class="content">在这里重启了。抛弃了繁琐的框架，只留下文字。</div>
        </div>
    </div>
</body>
</html>
